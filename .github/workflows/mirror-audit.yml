# Scheduled audit of the PUBLISHED mirror (#586).
#
# Why scheduled rather than a local gate, per THE LINE: local gates own what is
# derivable from the working tree; a scheduler owns what changes when the tree
# does not. The published mirror can change with no commit here at all -- the
# same argument that justified the CVE re-scan (#560).
#
# Guarded to the development repo. On the mirror itself this is a no-op: it
# would be auditing itself, and a repo that audits itself is not an independent
# check. Note a fork also matches this guard; harmless, since GitHub disables
# scheduled workflows in forks.
name: Mirror audit

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.repository != 'tiermetric/tier'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Prove the harness works BEFORE trusting its verdict. A gate that has
      # silently stopped firing reports CLEAN on every repo forever, and the
      # audit alone cannot tell that apart from a genuinely clean mirror.
      # 🔴 CALLED DIRECTLY, NOT THROUGH `make` (#682). mirror-audit.sh carries the
      # same three-valued contract as the CVE re-scanner -- 0 clean / 1 findings,
      # i.e. SOMETHING IS PUBLIC THAT SHOULD NOT BE / 2 could not run -- and GNU
      # make exits 2 on a failed recipe whatever the recipe returned. Through
      # `make` a real mirror leak arrived as "could not run". This script exists
      # because a 6.6 MB artifact sat public for three days, so conflating "leak
      # found" with "clone failed" is not academic. The make targets stay for
      # local use; image-cve-rescan.sh --selftest fails if these lines regrow a
      # `make`. (The targets' absent-script soft-skip is not lost in practice:
      # this job never runs anywhere the script is missing -- it is guarded off
      # the mirror above, and the export is the only tree without the script.)
      - name: Selftest the audit (fires on a violation planted in history)
        run: scripts/mirror-audit.sh --selftest

      - name: Audit the published mirror
        run: scripts/mirror-audit.sh
