  # ── Open-weights host-qualified per-token rates (#268) ──────────────────────────
  # These key `NormalizeModel(model)@<bare-hostname>` (store.HostModelKey). A host-
  # qualified rate outranks the model-only rate, but ONLY for that host; every other
  # host still prices at the model-only / size-class path. The model-id portion is the
  # EXACT string each host echoes in the response `model` field, normalized — it
  # differs per host (Groq `llama-3.3-70b-versatile`, Together
  # `.../Llama-3.3-70B-Instruct-Turbo`), so a key matches ONE host's id, not a canonical
  # name; a mismatched key silently misses and falls to the size-class path. provider:
  # self-hosted (open-weights → 1.0x cache, no documented prompt-cache discount on these
  # hosts today); billing_mode: per_token is set explicitly (these hosts meter per token,
  # so the rate is an audited list price, NOT the self-hosted amortized default). Rates
  # captured 2026-07-13; hosted-open-weights pricing is the most volatile segment, so this
  # set is small and backfilled on demand (override with `tierd --prices` if drifted).

