  # "opus-4-1/4-5 at $5/$25" — that $5/$25 applies to 4.5+ only, NOT to 4.1 (#135).
  claude-opus-4-1: { input_per_m: 15.00, output_per_m: 75.00, provider: anthropic }   # Opus 4.1 (legacy flagship)
  claude-opus-4-5: { input_per_m: 5.00, output_per_m: 25.00, provider: anthropic }   # Opus 4.5
  claude-opus-4-6: { input_per_m: 5.00, output_per_m: 25.00, provider: anthropic }   # Opus 4.6
  claude-opus-4-7: { input_per_m: 5.00, output_per_m: 25.00, provider: anthropic }   # Opus 4.7
  claude-opus-4-8: { input_per_m: 5.00, output_per_m: 25.00, provider: anthropic }   # Opus 4.8
  # Opus 5 is the current flagship and carries the SAME $5/$25 as Opus 4.8 — the
  # generation advanced, the rate did not (claude.com model catalog + pricing page,
  # captured 2026-07-26). Verified before adding, not assumed from the 4.x pattern:
  # Opus 4.1 sits at $15/$75 two rows up, so "newer Opus = $5/$25" is NOT a rule.
  # Why it needs its own row: NormalizeModel does not collapse opus-5 to opus-4-8,
  # so without this entry ComputeCost falls through to the size-class heuristic and
  # bills Opus 5 traffic at a GUESSED self-hosted rate behind a one-time WARN (#267)
  # — precisely the silent-estimate failure this table exists to prevent.
  # CAVEAT (not encoded): fast mode (speed=fast) bills at $10/$50, DOUBLE this rate,
  # and TIER does not capture the speed flag — so fast-mode Opus 5 traffic prices LOW.
  # This is NOT the same class as the un-encoded batch discount, and the direction is
  # what matters: batch is -50%, so list-pricing it OVER-states cost and TIER reads
  # worse than reality (conservative). Fast mode is +100%, so it UNDER-states cost —
  # and cost is TIER's denominator, so the error inflates the score. On a metric whose
  # whole claim is honest cost-per-outcome, an optimistic-direction error is the
  # dangerous one. (Priority Tier does not cover Opus 5 at all, so there is no
  # priority rate omitted here.) Unlike an unknown model, this path emits no WARN and
  # no data_quality signal, which is the one gap in #267's no-silent-guess rule —
  # `usage.speed` is already on the wire and decoded by both capture paths, so
  # capturing it is a small follow-up rather than a redesign.
  claude-opus-5: { input_per_m: 5.00, output_per_m: 25.00, provider: anthropic }   # Opus 5
  claude-fable-5: { input_per_m: 10.00, output_per_m: 50.00, provider: anthropic }   # Fable 5
