  "meta-llama/llama-3.1-8b-instruct@openrouter.ai": { input_per_m: 0.02, output_per_m: 0.03, provider: self-hosted, billing_mode: per_token }   # openrouter.ai/meta-llama/llama-3.1-8b-instruct
  "qwen/qwen-2.5-72b-instruct@openrouter.ai": { input_per_m: 0.36, output_per_m: 0.40, provider: self-hosted, billing_mode: per_token }         # openrouter.ai/qwen/qwen-2.5-72b-instruct
  # `deepseek/deepseek-chat-v3-0324` normalizes to `-v3` (NormalizeModel strips the
  # trailing 4-digit `-0324`), so the key drops it; the moving `deepseek-chat` alias is
