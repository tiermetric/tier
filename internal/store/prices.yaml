# TIER Reference Price Table — list prices, US dollars per million tokens.
#
# This file is the SINGLE SOURCE OF TRUTH for model list prices (#68). It is
# embedded into the tierd binary via go:embed (so the static image ships no
# external file and zero-config still works) and parsed once at startup. An
# operator may override it at runtime with `tierd --prices /path/to/prices.yaml`
# (or the prices_file config key / TIER_PRICES env); a bad override fails startup
# loudly rather than silently falling back.
#
# version + effective_date version the table as one atomic unit. Bump version on
# any price change; effective_date (YYYY-MM-DD) stamps when the table was last
# revised as a whole — NOT a guarantee that every row was (re)captured on that
# date. Individual rows may have been captured earlier and carried forward; the
# per-version changelog below records what each revision actually touched. The
# original three-rules intent was an annual, full-calendar-year pin; mid-year
# revisions (v5–v7) advance version and, where a revision re-verifies real rows,
# effective_date, while leaving untouched rows at their prior captured values.
#
# `version` is a whole-table revision counter, NOT a schema-compatibility lever:
# tierd strict-decodes against the schema it was COMPILED with (unknown keys are
# rejected), so a file adding new keys requires a binary upgrade — an older tierd
# will fail loudly on it rather than silently ignore the additions.
#
# Cache multipliers ARE stored here, per model (#122, reversing the earlier
# per-provider design). Each model MAY carry optional cache_read_mult,
# cache_write_5m_mult, cache_write_1h_mult (floats, multipliers of the input
# rate). Omitted / 0 means "use the provider default"; an explicit positive value
# overrides that class. Provider defaults: anthropic 5m 1.25x / 1h 2.0x / read
# 0.1x; openai read 0.5x (no write SKU); google/xai/deepseek/self-hosted 1.0x.
# Rationale: real discounts are per-MODEL, not per-provider (OpenAI 4-era reads
# at 0.5x but the 5-era at 0.1x; Gemini 2.5+ implicit cache reads at 0.25x;
# DeepSeek publishes an absolute $0.028/M hit). A negative multiplier, or any
# multiplier on a combined entry, is a parse error. See docs/reference-price-table.md §7.
#
# provider must be one of: anthropic, openai, google, xai, deepseek, self-hosted.
# combined: true marks a self-hosted entry where in+out share input_per_m and no
# cache discount applies; output_per_m is omitted for those.
#
# billing_mode (#300): per_token | subscription | self_hosted_amortized. Omitted
# derives from provider — self_hosted_amortized for a self-hosted entry, per_token
# otherwise. The host-qualified open-weights rows (#268, at the bottom) set it
# EXPLICITLY to per_token to override that self-hosted default: those hosts are
# open-weights (self-hosted provider → 1.0x cache) but genuinely METER per token, so
# the rate is an audited list price, not an amortized estimate. subscription rows
# (Ollama Cloud / GLM, #113) are NOT seeded — they await the /events billing_mode
# export (#304), or an exported cost would ship as a canonical $/M with no flag.
#
# Host-qualified keys (#300/#268): a key of the form `NormalizeModel(model)@<host>`
# (see store.HostModelKey) prices a model on ONE serving host — the cost of an
# open-weights model is a property of the host, not the weights. The host is the
# bare `--openai-target` hostname the proxy stamps (url.URL.Hostname(), port dropped).
# See docs/open-weights-capture.md.
#
# Long-context tier (#4): a model MAY carry an optional over-threshold tier —
# context_threshold (token count), input_per_m_over, output_per_m_over. A request
# whose input-side context (input + all cache classes) EXCEEDS context_threshold
# is priced at the *_over rates instead of the base rates (ComputeCost picks the
# tier by the call's token counts). Used for Anthropic's Sonnet 1M beta (>200K =
# $6/$22.50) and Gemini Pro (>200K premium). All three fields are set together or
# none — a partial spec is a parse error. Not valid on a combined entry.
#
# The three self-hosted-{large,medium,small} entries are REQUIRED: self-hosted-medium
# is the unknown-model fallback rate, and selfHostedClass() resolves param-count
# heuristics to these keys. Parsing rejects a table missing any of them.
#
# Minor-version aliases (opus-4-6/4-7/4-8, sonnet-4-6/4-7, haiku-4-5, fable-5) are
# listed EXPLICITLY: NormalizeModel only strips date suffixes, not single trailing
# digits, and each minor version carries its OWN audited price — they do NOT inherit
# the base-family rate (Opus 4.0 is $15/$75 but 4.6/4.7/4.8 re-priced to $5/$25;
# Fable 5 is a distinct family at $10/$50). A new minor version must be added here
# or it falls through to the self-hosted-medium fallback with a one-time WARN (#80).

# v5 (#135): added the RPT-2026 §1/§4 models missing from v4 — the gpt-5.x
# family, o1, o4-mini, grok-4/4-fast/4.1-fast/code-fast-1/3-fast,
# claude-opus-4-1 and 4-5, gemini flash-lite/3-flash/3.1-flash-lite, and
# deepseek-v3.2. The gpt-5.x entries carry an explicit cache_read_mult 0.10
# (the 5-era prompt-cache discount, RPT §7 — differs from the openai 4-era
# 0.50 default). Providers not on the validProviders allowlist
# (Mistral/Cohere/Amazon/hosted-OSS) are intentionally NOT listed: they still
# fall back at self-hosted-medium with a WARN, now alertable via the
# unknown-model cost share (#135). See docs/reference-price-table.md.
#
# v6 (#268): added host-qualified per-token rates for the top open-weights models on
# the common per-token inference hosts (OpenRouter, Together, Fireworks, Groq,
# DeepInfra) — see the bottom section. effective_date stays the 2026-03-01 RPT anchor
# (like v5, which added models without re-dating the frontier table); the host rows
# were captured 2026-07-13 and each carries its own source comment. Only per-token
# hosts are seeded; subscription hosts (#113) await #304.
#
# v7 (#268/#300): added the current first-party Anthropic models that were still
# falling through to the size-class 'guessed' fallback (a visible WARN, #286) —
# claude-sonnet-5 ($3/$15 list) and claude-mythos-5 ($10/$50). The rest of the
# current lineup (Opus 4.8/4.7/4.6, Fable 5, Haiku 4.5) was already priced (v5/#80).
# Both new rows use claude.com published LIST prices; Sonnet 5's $2/$10 intro promo
# (through 2026-08-31) is intentionally NOT encoded (the table is list-price, and
# there is no time-based tier). UNLIKE v5/v6, this revision DOES advance
# effective_date to the 2026-07-13 capture date: only the Anthropic rows added/re-
# verified this pass were checked against current published rates — the non-Anthropic
# frontier rows are carried forward unchanged from the 2026-03-01 RPT anchor and were
# NOT re-validated here. The date stamps when the table as a unit was last revised.
# v8 (#461): added the three GPT-5.6 Codex models (sol/terra/luna) that were falling
# through to the size-class 'guessed' fallback (WARN) — they had no rows, so TIER
# could not price Codex traffic at all. Rates are OpenAI's published STANDARD-tier
# list prices (platform.openai.com/pricing, captured 2026-07-22): sol $5/$30,
# terra $2.50/$15, luna $1/$6; cached-input is exactly 0.10x input in all three
# (cache_read_mult 0.10, consistent with the other gpt-5.x rows). Batch (-50%) and
# priority tiers are NOT encoded (the table is standard list-price). Only these three
# rows were validated this pass; effective_date advances to the 2026-07-22 capture.
# v9 (#512-adjacent): added claude-opus-5 at $5/$25 — the same rate as Opus 4.8,
# verified against the claude.com model catalog and pricing page on 2026-07-26
# rather than inferred from the 4.x pattern (Opus 4.1 is $15/$75, so the pattern
# does not hold). Only this row was validated this pass; effective_date advances
# to the 2026-07-26 capture.
# ⚠ BUMPING THIS VERSION CHANGES prices_yaml_sha256, which every archived
# model-bench evidence bundle is stamped with. Edition 1's panel was measured
# under v8 and is frozen: a v9 run CANNOT join it (the protocol requires one rate
# table across a panel). Opus 5 measurements belong to a NEW edition — re-derive
# Edition 1's anchor dollars under v9 from the unchanged token evidence if you
# publish a cross-edition price delta, or the delta is part model, part table.
# EXPECTED ON DEPLOY, not a fault (both follow from #233 per-row immutability):
# a /scores window straddling the deploy reports data_quality.mixed_price_versions
# [8, 9] until the v8 rows age out (#293), and `tierd doctor` WARNs "local price
# table v9 != server v8" against any tierd not yet redeployed. Already-stored
# cost_micro keeps its v8 price and stamp; a row captured at a GUESSED rate does
# NOT self-heal on re-ship — `tierd reprice --allow-guessed` is the repair path.
version: 9
effective_date: "2026-07-26"

models:
  # Anthropic
  claude-opus-4: { input_per_m: 15.00, output_per_m: 75.00, provider: anthropic }   # Opus 4.0
  # Opus 4.1 stays at Opus-4-generation pricing $15/$75 (RPT §1.1, the authority);
